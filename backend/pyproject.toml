[project]
name = "blueos-sitl-manager"
version = "0.3.0"
description = "BlueOS extension to manage SITL vehicle type, ambient conditions, spawn location and battery."
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.7.4,<=3.13.2",
  "fastapi==0.105.0",
  "fastapi-versioning==0.9.1",
  "loguru==0.5.3",
  "pydantic==1.10.12",
  "uvicorn==0.18.0",
  "httptools==0.6.4",
  "wsproto==1.2.0",
]

[dependency-groups]
dev = [
  "pytest==7.4.2",
  "pytest-asyncio==0.14.0",
]
lint = [
  "black==22.3.0",
  "isort==5.8",
  "mypy==1.4.1",
  "pylint==3.0",
  "ruff==0.0.288",
]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"

[tool.mypy]
ignore_missing_imports = true
strict = true
plugins = "pydantic.mypy"

[tool.ruff]
line-length = 120
ignore = [
  "E501", # LineTooLong: handled by black
]

[tool.pylint.messages_control]
disable = [
  "broad-except",
  "missing-class-docstring",
  "missing-function-docstring",
  "missing-module-docstring",
  "global-statement",
]
